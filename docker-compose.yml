      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kurrentdb-shard0-data:
  kurrentdb-shard0-logs:
  kurrentdb-shard1-data:
  kurrentdb-shard1-logs:
  kurrentdb-shard2-data:
  kurrentdb-shard2-logs:
  kurrentdb-shard3-data:
  kurrentdb-shard3-logs:
