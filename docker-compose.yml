services:

  # ── Shard 0 — port 2113 ───────────────────────────────────────────────────
  kurrentdb-shard0:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    container_name: kurrentdb-shard0
    environment:
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "2113:2113"
    volumes:
      - kurrentdb-shard0-data:/var/lib/eventstore
      - kurrentdb-shard0-logs:/var/log/eventstore
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Shard 1 — port 2114 ───────────────────────────────────────────────────
  kurrentdb-shard1:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    container_name: kurrentdb-shard1
