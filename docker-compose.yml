  # ── Shard 3 — port 2116 (used during scale-out demo step) ────────────────
  kurrentdb-shard3:
    image: eventstore/eventstore:24.10.0-bookworm-slim
    container_name: kurrentdb-shard3
    environment:
      - EVENTSTORE_INSECURE=true
